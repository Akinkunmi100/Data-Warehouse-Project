# ══════════════════════════════════════════
# Research Data Platform — Core Services
# ══════════════════════════════════════════
# Start: docker compose up -d
# Stop:  docker compose down

services:

  postgres:
    image: postgres:16-alpine
    container_name: rp-postgres
    restart: always
    mem_limit: 3g
    env_file: ./secrets/.env
    volumes:
      - rp-postgres-data:/var/lib/postgresql/data
      # 01: DDL — schemas, tables, roles (no hardcoded passwords)
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # 02: Passwords — applied from secrets/.env env vars
      - ./scripts/init_users.sh:/docker-entrypoint-initdb.d/02_init_users.sh:ro
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metabase needs its OWN separate database — uses dedicated init script
  metabase-db-init:
    image: postgres:16-alpine
    container_name: rp-metabase-db-init
    restart: "no"
    env_file: ./secrets/.env
    volumes:
      - ./scripts/metabase_init.sh:/metabase_init.sh:ro
    entrypoint: ["sh", "/metabase_init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: rp-minio
    restart: always
    mem_limit: 1g
    env_file: ./secrets/.env
    command: server /data --console-address ":9001"
    volumes:
      - rp-minio-data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  prefect:
    image: prefecthq/prefect:3-latest
    container_name: rp-prefect
    restart: always
    mem_limit: 512m
    command: prefect server start
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      # Inside the container localhost reaches the Prefect server itself — correct
      PREFECT_API_URL: "http://localhost:4200/api"
    volumes:
      - ./prefect:/root/.prefect
    ports: ["4200:4200"]

volumes:
  rp-postgres-data:
    name: rp-postgres-data
  rp-minio-data:
    name: rp-minio-data
