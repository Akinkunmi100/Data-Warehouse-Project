version: 2

models:
  # ── Bronze layer ────────────────────────────────────────────────────────────
  - name: stg_mtn_project_appraise
    description: "Pass-through staging view over client_mtn.project_appraise."
    columns:
      - name: submission_uuid
        description: "Primary key — SurveyCTO KEY field renamed by ETL."
        tests:
          - not_null
          - unique
      - name: review_status
        description: "SurveyCTO review console status."
        tests:
          - accepted_values:
              values: ['approved', 'rejected', 'unknown']

  - name: stg_unilever_retail
    description: "Pass-through staging view over client_unilever.unilever_retail."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: review_status
        tests:
          - accepted_values:
              values: ['approved', 'rejected', 'unknown']

  - name: stg_internal_census
    description: "Pass-through staging view over internal.internal_census."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: review_status
        tests:
          - accepted_values:
              values: ['approved', 'rejected', 'unknown']

  # ── Silver layer ────────────────────────────────────────────────────────────
  - name: int_mtn_project_appraise
    description: "Cleaned MTN silver model — normalised review_status, approval flags."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: is_approved
        tests:
          - not_null
      - name: review_status_clean
        tests:
          - accepted_values:
              values: ['approved', 'rejected', null]
              quote: false

  - name: int_unilever_retail
    description: "Cleaned Unilever silver model."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: is_approved
        tests:
          - not_null

  - name: int_internal_census
    description: "Cleaned internal census silver model."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: is_approved
        tests:
          - not_null
