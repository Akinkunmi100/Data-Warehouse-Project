version: 2

models:
  # ── Bronze layer ────────────────────────────────────────────────────────────
  - name: stg_mtn_project_appraise
    description: "Pass-through staging view over client_mtn.project_appraise."
    columns:
      - name: submission_uuid
        description: "Primary key — SurveyCTO KEY field renamed by ETL."
        tests:
          - not_null
          - unique
      - name: review_status
        description: "SurveyCTO review console status."
        tests:
          - accepted_values:
              arguments:
                values: ['approved', 'rejected', 'unknown', 'APPROVED', 'REJECTED', 'UNKNOWN']

  - name: stg_unilever_retail
    description: "Pass-through staging view over client_unilever.unilever_retail."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: review_status
        tests:
          - accepted_values:
              arguments:
                values: ['approved', 'rejected', 'unknown', 'APPROVED', 'REJECTED', 'UNKNOWN']

  - name: stg_internal_census
    description: "Pass-through staging view over internal.internal_census."
    columns:
      - name: submission_uuid
        tests:
          - not_null
          - unique
      - name: review_status
        tests:
          - accepted_values:
              arguments:
                values: ['approved', 'rejected', 'unknown', 'APPROVED', 'REJECTED', 'UNKNOWN']

  - name: stg_cis_consumer_june
    description: "Pass-through staging view over client_cis_consumer_june.cis_consumer_june."

  - name: stg_construction_sites
    description: "Pass-through staging view over client_construction_sites.construction_sites."

  - name: stg_project_ojude_oba
