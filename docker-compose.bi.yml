# ══════════════════════════════════════════
# Research Data Platform — Business Intelligence (On-Demand Only)
# ══════════════════════════════════════════
# CRITICAL: Metabase and Superset consume ~1.5GB RAM each.
# Never start both at the same time to avoid OOM crashes.
#
# Usage:
#   docker compose --env-file secrets/.env -f docker-compose.bi.yml up metabase -d
#   docker compose --env-file secrets/.env -f docker-compose.bi.yml up superset -d
#   docker compose --env-file secrets/.env -f docker-compose.bi.yml stop

services:

  metabase:
    image: metabase/metabase:latest
    container_name: rp-metabase
    restart: always
    mem_limit: 1500m
    env_file: ./secrets/.env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_DBNAME: ${METABASE_DB_NAME}
    ports: ["3030:3000"]

  superset:
    image: apache/superset:latest
    container_name: rp-superset
    restart: always
    mem_limit: 1500m
    env_file: ./secrets/.env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    # On a fresh volume Superset's metadata DB is uninitialized — the UI will
    # error out immediately without this init sequence. db upgrade is idempotent
    # so re-running on an existing volume is safe. The admin credentials here
    # are first-time bootstrap only; change them via the UI after first login.
    #
    # Shell note: create-admin is wrapped in a subshell ( ... ) so that the
    # || true only guards THAT step. Without the subshell, shell left-associativity
    # would cause || true to also mask a failing db upgrade, letting gunicorn
    # start on a broken metadata database.
    command: >
      sh -c "
        set -e &&
        superset db upgrade &&
        ( superset fab create-admin
            --username admin
            --firstname Admin
            --lastname Admin
            --email admin@research-platform.local
            --password ${SUPERSET_ADMIN_PASSWORD:-admin}
            2>/dev/null || true ) &&
        superset init &&
        gunicorn
          --bind 0.0.0.0:8088
          --workers 2
          --timeout 120
          'superset.app:create_app()'
      "
    ports: ["8088:8088"]

networks:
  default:
    name: research-platform_default
    external: true
